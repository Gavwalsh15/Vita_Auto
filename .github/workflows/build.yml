name: Build

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      release_version:
        description: Version tag to publish, e.g v0.1.0.
        required: false # We will move to auto tags if releases are often
        type: string
      prerelease:
        description: Mark the manual release as a prerelease.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Vita Auto (${{ matrix.flavor }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      # Official 2026.08 SDK, pinned.
      image: vitasdk/vitasdk:2026.08@sha256:07031c0abbad8b89503b7d69ddcafddf69cc3b0744c4576c1d5536efac26d574
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: quiet
            verbose-logging: 'OFF'
            performance: 'OFF'
          - flavor: diagnostic
            verbose-logging: 'ON'
            performance: 'ON'
    steps:
      - name: Checkout with pinned dependencies
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          submodules: recursive
          persist-credentials: false

      - name: Build
        uses: ./.github/action
        with:
          verbose-logging: ${{ matrix.verbose-logging }}
          performance: ${{ matrix.performance }}

      - name: Upload installables
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vita-auto-${{ matrix.flavor }}
          path: |
            dist/vita_auto.vpk
            dist/vita_auto_usb.skprx
            dist/vita_auto_usb_client.suprx
          if-no-files-found: error
          retention-days: 14

  release:
    needs: build
    name: Publish release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.release_version != '')
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      MANUAL_VERSION: ${{ inputs.release_version }}
      MANUAL_PRERELEASE: ${{ inputs.prerelease }}
    steps:
      - name: Checkout release target
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME}"
            prerelease=false
          else
            version="${MANUAL_VERSION}"
            prerelease="${MANUAL_PRERELEASE}"
          fi

          if [[ ! "$version" =~ ^v[0-9A-Za-z._-]+$ ]]; then
            echo "release_version must look like v0.1.0" >&2
            exit 1
          fi

          if [[ "$version" == *-* ]]; then
            prerelease=true
          fi

          if git show-ref --verify --quiet "refs/tags/$version"; then
            tagged_commit=$(git rev-parse "refs/tags/${version}^{commit}")
            built_commit=$(git rev-parse "${GITHUB_SHA}^{commit}")
            if [[ "$tagged_commit" != "$built_commit" ]]; then
              echo "Tag $version does not point to the source built by this run." >&2
              exit 1
            fi
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Download build artifacts
        shell: bash
        run: |
          mkdir -p release/quiet release/diagnostic
          gh run download "$GITHUB_RUN_ID" --name vita-auto-quiet --dir release/quiet
          gh run download "$GITHUB_RUN_ID" --name vita-auto-diagnostic --dir release/diagnostic

      - name: Package release assets
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p package release/assets

          for flavor in quiet diagnostic; do
            package_dir="package/vita-auto-${RELEASE_VERSION}-${flavor}"
            mkdir -p "$package_dir"
            cp "release/${flavor}/vita_auto.vpk" "$package_dir/"
            cp "release/${flavor}/vita_auto_usb.skprx" "$package_dir/"
            cp "release/${flavor}/vita_auto_usb_client.suprx" "$package_dir/"
            cp README.md LICENSE "$package_dir/"
            cp -r docs "$package_dir/"
            mkdir -p "$package_dir/licenses"
            cp third_party/mbedtls/LICENSE "$package_dir/licenses/mbedtls.txt"
            cp third_party/libvita2d/LICENSE "$package_dir/licenses/libvita2d.txt"
            (cd package && zip -r "../release/assets/vita-auto-${RELEASE_VERSION}-${flavor}.zip" "vita-auto-${RELEASE_VERSION}-${flavor}")
          done

          (cd release/assets && sha256sum *.zip > SHA256SUMS.txt)

      - name: Publish GitHub release
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          args=(
            release create "$RELEASE_VERSION"
            release/assets/*.zip
            release/assets/SHA256SUMS.txt
            --target "$GITHUB_SHA"
            --title "Vita Auto ${RELEASE_VERSION}"
            --generate-notes
          )

          if [[ "$RELEASE_PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi

          gh "${args[@]}"
